# Custom Pywal theme

[meta]
name = "Pywal"
description = "A custom theme generated by Pywal."
variant = ""
icon = "icons/pywal.png"

[colors.core]
background = "{background}"             # base
foreground = "{foreground}"             # text
secondary_background = "{background}"   # surface
border = "{color2}"                      # overlay (subtle border)
accent = "{color1}"                     # pine

[colors.accents]
blue = "{color4}"              # pine
green = "{color2}"             # foam
magenta = "{color5}"           # iris
orange = "{color3}"            # rose
purple = "{color5}"            # iris
red = "{color1}"               # love
yellow = "{color3}"            # gold
cyan = "{color6}"              # foam

[colors.list.item.selection]
background = {{ name = "colors.core.accent", opacity = 0.2 }}
secondary_background = {{ name = "colors.core.accent", opacity = 0.2 }}
